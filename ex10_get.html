<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Formulaire GET</title>
</head>
<body>
    <h2>Formulaire d'inscription (Méthode GET)</h2>
    <form action="ex10_get.php" method="GET">
        <label>Nom :</label><br>
        <input type="text" name="nom" value="Oulamine"><br><br>

        <label>Prénom :</label><br>
        <input type="text" name="prenom" value="Hamza"><br><br>

        <label>Groupe :</label><br>
        <select name="groupe">
            <option value="">-- Choisir --</option>
            <option value="G1">G1</option>
            <option value="G2">G2</option>
            <option value="G3">G3</option>
            <option value="G4" selected>G4</option>
        </select><br><br>

        <button type="submit">Envoyer</button>
    </form>
</body>
</html>
